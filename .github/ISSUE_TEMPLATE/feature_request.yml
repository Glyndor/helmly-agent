name: Feature request
description: Propose a new feature or improvement for helmly-agent
title: "[feat]: "
labels: ["type:feature", "status:triage"]
body:
  - type: input
    id: component
    attributes:
      label: Component
      description: Which subsystem this affects (e.g. podman, nftables, wireguard, update, systemd unit, tls, audit sync, installer).
      placeholder: podman
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve? Why is it needed?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should it work?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about, including "do nothing".
