name: cargo audit and cargo deny
description: >-
  Install cargo-audit and cargo-deny from their pinned release binaries and run
  both against the lockfile. The one place the two tools, their versions and
  their checksums are named, so the pull request gate, the weekly run and the
  release gate cannot disagree about what is accepted.

# The binaries are downloaded, not built with `cargo install`: compiling the two
# took about five minutes of every run (the `audit` job averaged 296 s over 21
# runs) and the compile pulled in a whole dependency tree that nobody reviews.
# Each download is checked against a sha256 written here before it is unpacked,
# and a version and its checksum move together or the install fails. To bump
# one: change the version and the checksum in the same commit. The checksum of
# each archive is the `digest` field (`sha256:<hex>`) that the GitHub API
# returns for that release asset (`gh api repos/<owner>/<repo>/releases/tags/<tag>`),
# and for cargo-deny it also equals the `<archive>.sha256` file published beside
# the release. It is the hash GitHub computed when the asset was uploaded, so it
# is a second source and not the download checked against itself.
#
# What each tool reads, and nothing else (no flag repeats it):
#   cargo audit  .cargo/audit.toml   ignores, each with its reachability argument
#   cargo deny   deny.toml           ignores, licenses, bans and sources

# Two modes. With no input it audits the tree the workflow checked out: cargo-audit
# on its lockfile and cargo-deny on its manifest. With `lockfile` it runs only
# cargo-audit, on that one file, from the directory that holds it. The weekly run
# uses the second mode for the branches it audits: it takes the lockfile and the
# audit configuration of another branch out of git, as data, into a directory
# outside the workspace, and never checks that branch's code out or lets cargo read
# its manifests. cargo-deny does not run there: what it adds to the advisory check
# (licenses, sources, bans) changes only when code changes, and that goes through
# the `audit` job of every pull request and every push to `develop`.

inputs:
  lockfile:
    description: Absolute path of a Cargo.lock to audit on its own, with the .cargo/audit.toml beside it; empty audits the checked-out tree.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install the toolchain
      if: ${{ inputs.lockfile == '' }}
      # cargo-deny asks `cargo metadata` for the dependency graph, so the
      # toolchain that `rust-toolchain.toml` names has to be present.
      shell: bash
      run: rustup toolchain install

    - name: Install cargo-audit and cargo-deny
      shell: bash
      env:
        AUDIT_VERSION: "0.23.0"
        AUDIT_SHA256: "4f01c74ed84b2dffd0b1d37012a62cdf2a92c96e25bdf8eec7fcc0d4d3eb7811"
        DENY_VERSION: "0.22.0"
        DENY_SHA256: "98c56e6a408bfa5c3c60744b6015aaa6aa08f743fdeb88386d06fca035bb1786"
      run: |
        set -euo pipefail
        dir="$RUNNER_TEMP/audit-tools"
        mkdir -p "$dir"

        audit_dir="cargo-audit-x86_64-unknown-linux-musl-v${AUDIT_VERSION}"
        curl -sSfL -o "$dir/audit.tgz" \
          "https://github.com/rustsec/rustsec/releases/download/cargo-audit%2Fv${AUDIT_VERSION}/${audit_dir}.tgz"
        printf '%s  %s\n' "$AUDIT_SHA256" "$dir/audit.tgz" | sha256sum -c -
        tar -xz -f "$dir/audit.tgz" -C "$dir" --strip-components=1 "${audit_dir}/cargo-audit"

        deny_dir="cargo-deny-${DENY_VERSION}-x86_64-unknown-linux-musl"
        curl -sSfL -o "$dir/deny.tgz" \
          "https://github.com/EmbarkStudios/cargo-deny/releases/download/${DENY_VERSION}/${deny_dir}.tar.gz"
        printf '%s  %s\n' "$DENY_SHA256" "$dir/deny.tgz" | sha256sum -c -
        tar -xz -f "$dir/deny.tgz" -C "$dir" --strip-components=1 "${deny_dir}/cargo-deny"

        echo "$dir" >> "$GITHUB_PATH"

    - name: cargo audit
      if: ${{ inputs.lockfile == '' }}
      # `--deny warnings` covers vulnerabilities, soundness, unmaintained,
      # unsound and yanked: every advisory class. `--no-yanked` stays absent on
      # purpose; it is class-wide and once hid a reachable yanked crate for a
      # month. A yanked crate is fixed with a lockfile bump, not an ignore.
      shell: bash
      run: cargo audit --deny warnings

    - name: cargo deny
      if: ${{ inputs.lockfile == '' }}
      shell: bash
      run: cargo deny check

    - name: cargo audit, on a lockfile alone
      if: ${{ inputs.lockfile != '' }}
      shell: bash
      env:
        LOCKFILE: ${{ inputs.lockfile }}
      # The binary is run directly, not through `cargo`, from the directory of the
      # lockfile, where the only configuration it can find is the
      # `.cargo/audit.toml` that was put beside it. A lockfile that is missing,
      # empty or a link is refused, so the audit cannot pass by finding nothing.
      run: |
        set -euo pipefail
        case "$LOCKFILE" in /*) ;; *) echo "::error::the lockfile path must be absolute"; exit 1 ;; esac
        if [ -L "$LOCKFILE" ] || [ ! -s "$LOCKFILE" ]; then
          echo "::error::$LOCKFILE is missing, empty or a link"
          exit 1
        fi
        cd "$(dirname "$LOCKFILE")"
        cargo-audit audit --deny warnings --file "$LOCKFILE"
