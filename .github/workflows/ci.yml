name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  rust:
    # The comment that stood here explained which upstream tag the SHA
    # pin resolved to. #158 removed the pin, so it explained nothing and
    # would have been read as current by the next person to open the file.
    uses: ./.github/workflows/reusable-rust-ci.yml
    with:
      # Coverage ratchet. The number went DOWN in this pull request and
      # the measurement got stricter, which is worth reading carefully
      # before anyone raises it back.
      #
      # Until now the `#[cfg(test)] mod tests` blocks lived inside the
      # files they test, and cargo-llvm-cov counted those test bodies as
      # covered lines of the production file. The tests were measuring
      # themselves. Moving them into sibling `tests.rs` files puts them
      # under llvm-cov's default filename exclusion, so they leave both
      # the numerator and the denominator.
      #
      # Measured with the reusable's own command, same commit, only the
      # move between them:
      #
      #   before   8673 lines, 5878 covered, 67.77%
      #   after    4941 lines, 2355 covered, 47.66%
      #
      # 47.66% is what production coverage has been all along; 67.77%
      # was roughly 20 points of test code vouching for itself. So 45
      # here is not a relaxed gate, it is the first honest one, with
      # ~2.7pp of margin. Raise it in the same pull request that raises
      # the coverage, never silently.
      coverage-threshold: 45

  # pin-policy is deliberately gone rather than copied. Its script matches
  # exactly one thing, `Glyndor/.github/.github/workflows/<X>.yml@<sha>`
  # (scripts/pin-policy.py:52), and this repository now has none of those.
  # Copying it would have produced a required-shaped check that can never
  # fail, which is worse than no check: it teaches everyone that green
  # means verified when it means "found nothing to look at".
  #
  # What it actually bought was "the versions you pin are current". That
  # question survives, it just moved: the third-party actions pinned inside
  # the reusables below are now files in this repository, so Dependabot's
  # github-actions ecosystem sees them and opens the bumps directly. The
  # freshness watcher below is what notices if it stops.

  dependabot-freshness:
    uses: ./.github/workflows/reusable-dependabot-freshness.yml
    with:
      max-age-days: 15

  # audit.yml is the only scheduled workflow here, weekly on Monday, and
  # until now nothing noticed if it stopped firing. A cron that silently
  # stops looks exactly like a cron with nothing to report: the last run is
  # green either way, and the absence of a newer one is the only signal.
  # 15 days is about two periods, so one missed Monday is tolerated and two
  # are not.
  schedule-freshness:
    # `actions: read` is required and is not optional politeness: a called
    # workflow cannot elevate beyond the permissions of its caller, and
    # reading run history needs that scope. Granted per job rather than
    # raised at the top of the file, so no other job gains it. Without it
    # the whole workflow fails to load, which is how this was found: the
    # run reported `startup_failure` with every check missing rather than
    # one job failing, and actionlint is clean either way.
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/reusable-schedule-freshness.yml
    with:
      workflow: audit.yml
      max-age-days: 15

  # The two installer scripts are the only shell in the repository, and until
  # now nothing linted them. Both are clean at shellcheck's strictest level
  # (`-S style`, 0 findings on setup-agent.sh and update-agent.sh as of this
  # commit), so adopting the gate costs nothing today and catches the next
  # edit rather than the next incident. setup-agent.sh is 1250 lines and runs
  # as root on a fresh server, which is the worst place to find out.
  #
  # No `test-command` is passed because there is no shell test suite here.
  # That is deliberate and it has a consequence worth writing down:
  # shell-ci.yml:167 guards its `test` job with `if: inputs.test-command != ''`,
  # so `shell / test` skips on every run, and a skipped check reports Success.
  # It must therefore not be made a required check while it skips, or the
  # ruleset would be satisfied by a job that never ran. `shell / shellcheck`
  # does run, and is the one worth promoting once it has been seen to fail.
  shell:
    uses: ./.github/workflows/reusable-shell-ci.yml

  # actionlint plus the org's own workflow checks. The one that earns its
  # place here is tooling-isolation: it fails when a job that holds a secret
  # also installs third-party tooling, which is what `release.yml` did until
  # #146 moved signing out of the build matrix. Adopting the gate now is what
  # keeps it from drifting back, and it caught a real regression on the way
  # in: the pinned `pip install` was wrapped across a line continuation, and
  # the check reads a run block line by line, so the `--require-hashes`
  # marker was not on the line it had to exempt.
  workflow-lint:
    uses: ./.github/workflows/reusable-workflow-lint.yml
