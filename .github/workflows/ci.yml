name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  rust:
    # Pin to v1.14.2 — the SHA `59d6af42` is reachable from `v1.14.2`,
    # `v1.15.0`, `v1.15.1`, so the comment `# main` was just stale. The
    # gate's surface has not changed in 1.14.x → 1.15.x; the SHA is
    # still the right one. Per `standards/ci/index.md:20` the comment
    # format is `@<sha> # vX.Y.Z`.
    uses: Glyndor/.github/.github/workflows/rust-ci.yml@59d6af42ba3a4f7baa05fd4dbca0701bf858b452 # v1.14.2
    with:
      # Coverage ratchet (measured 2026-08-17 on develop: 49.80%
      # lines / 57.50% functions / 50.68% regions after the logic-
      # pure test round). Threshold 47 leaves 2.8pp of margin under
      # the measured value — wide enough to add code without
      # fighting the gate on every PR, narrow enough that any
      # regression real enough to drop coverage by 3pp fails the
      # build. The threshold raises in the same PR that raises the
      # coverage — never silently. The next step is the pure-logic
      # files at 0% (error.rs, cert.rs, handlers/metrics.rs,
      # handlers/nftables.rs), each ~150–170 lines that don't need
      # podman/nginx/network — those go first because they raise the
      # ratchet cheaply.
      coverage-threshold: 47
