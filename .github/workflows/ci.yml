name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  rust:
    # Pin to v1.14.2 — the SHA `59d6af42` is reachable from `v1.14.2`,
    # `v1.15.0`, `v1.15.1`, so the comment `# main` was just stale. The
    # gate's surface has not changed in 1.14.x → 1.15.x; the SHA is
    # still the right one. Per `standards/ci/index.md:20` the comment
    # format is `@<sha> # vX.Y.Z`.
    uses: Glyndor/.github/.github/workflows/rust-ci.yml@d5041b038b7d4935e75400dff612962e6fa14893 # v1.21.0
    with:
      # Coverage ratchet (measured 2026-08-17 on develop: 66.04%
      # lines / 72.64% functions / 67.77% regions after adding
      # handlers/metrics.rs (0% → 89.42%) and nftables/divergence.rs
      # (0% → 88.24%) tests). Threshold 63 leaves ~3pp of margin
      # under the measured value. The threshold raises in the
      # same PR that raises the coverage — never silently.
      coverage-threshold: 63

  pin-policy:
    uses: Glyndor/.github/.github/workflows/pin-policy-reusable.yml@d4bbc5b6ec0c351ca4cb17d948ceaad818da4078 # v1.18.1

  dependabot-freshness:
    uses: Glyndor/.github/.github/workflows/dependabot-freshness.yml@d4bbc5b6ec0c351ca4cb17d948ceaad818da4078 # v1.18.1
    with:
      max-age-days: 15

  # The two installer scripts are the only shell in the repository, and until
  # now nothing linted them. Both are clean at shellcheck's strictest level
  # (`-S style`, 0 findings on setup-agent.sh and update-agent.sh as of this
  # commit), so adopting the gate costs nothing today and catches the next
  # edit rather than the next incident. setup-agent.sh is 1250 lines and runs
  # as root on a fresh server, which is the worst place to find out.
  #
  # No `test-command` is passed because there is no shell test suite here.
  # That is deliberate and it has a consequence worth writing down:
  # shell-ci.yml:167 guards its `test` job with `if: inputs.test-command != ''`,
  # so `shell / test` skips on every run, and a skipped check reports Success.
  # It must therefore not be made a required check while it skips, or the
  # ruleset would be satisfied by a job that never ran. `shell / shellcheck`
  # does run, and is the one worth promoting once it has been seen to fail.
  shell:
    uses: Glyndor/.github/.github/workflows/shell-ci.yml@d5041b038b7d4935e75400dff612962e6fa14893 # v1.21.0

  # Signed-off-by on every commit. The DCO gate is advisory here rather than
  # required, so it reports rather than blocks, which is the right order:
  # promote it to a required check only after it has run on real pull requests
  # and been seen to fail for its own reason.
  dco:
    uses: Glyndor/.github/.github/workflows/dco.yml@d5041b038b7d4935e75400dff612962e6fa14893 # v1.21.0

  # actionlint plus the org's own workflow checks. The one that earns its
  # place here is tooling-isolation: it fails when a job that holds a secret
  # also installs third-party tooling, which is what `release.yml` did until
  # #146 moved signing out of the build matrix. Adopting the gate now is what
  # keeps it from drifting back, and it caught a real regression on the way
  # in: the pinned `pip install` was wrapped across a line continuation, and
  # the check reads a run block line by line, so the `--require-hashes`
  # marker was not on the line it had to exempt.
  workflow-lint:
    uses: Glyndor/.github/.github/workflows/workflow-lint.yml@d5041b038b7d4935e75400dff612962e6fa14893 # v1.21.0
