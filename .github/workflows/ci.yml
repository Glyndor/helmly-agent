name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  rust:
    # Pin to v1.14.2 — the SHA `59d6af42` is reachable from `v1.14.2`,
    # `v1.15.0`, `v1.15.1`, so the comment `# main` was just stale. The
    # gate's surface has not changed in 1.14.x → 1.15.x; the SHA is
    # still the right one. Per `standards/ci/index.md:20` the comment
    # format is `@<sha> # vX.Y.Z`.
    uses: Glyndor/.github/.github/workflows/rust-ci.yml@59d6af42ba3a4f7baa05fd4dbca0701bf858b452 # v1.14.2
    with:
      # Coverage ratchet (measured 2026-08-17 on develop: 61.30%
      # lines / 69.60% functions / 63.40% regions after the pure-
      # logic test round for error.rs, cert.rs, metrics/mod.rs,
      # handlers/nftables.rs, handlers/containers.rs — five PRs,
      # +11.5pp combined, all mutation-verified per
      # standards/testing/index.md). Threshold 59 leaves 2.3pp
      # of margin under the measured value. The threshold raises
      # in the same PR that raises the coverage — never silently.
      coverage-threshold: 59
