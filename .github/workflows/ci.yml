name: CI

# Which events run this, and why each one:
#
# - pull_request into develop or main: the gate. Every required check of both
#   branches comes from here.
# - push to develop: the merge is a squash, so the commit that lands is not one
#   any pull request tested, and `strict` status checks are off. This run tests
#   what develop really is. A push to main is not run: a release arrives there
#   as a merge of a `develop` that this workflow has already tested, and the
#   pull request into main ran every required check on the same tree.
#
# What one run costs, and what makes it skip. Measured on the 18 pull request
# commits behind the 21 CI runs of 2026-08-28 to 2026-11-23: about 5.4 minutes
# of jobs per run for the Rust suite, 0.5 for shell and workflow lint, 5 for the
# audit (about 30 seconds now, see the audit job). The `decide` job below reads the paths a change touched against
# `.github/ci-map.json` and tells each suite whether it has anything to look at;
# a documentation change runs no suite, and a change to one workflow file runs
# only the workflow lint and the shell suite. The audit has no plan.
#
# The check the rulesets require is `ci-gate`, one job that always runs. A
# suite that is not needed does not leave its jobs out: they are there and
# skipped. GitHub counts a skipped required check as passed, so no suite is
# required by its own name; `ci-gate` fails unless the plan succeeded and each
# suite succeeded or was skipped because the plan said it had nothing to check.
# Each decision FAILS OPEN: if `decide` cannot read the diff it answers
# `true` for every suite, and if it fails outright its outputs are empty, an
# empty output is not `false`, every suite runs, and `ci-gate` is red.
#
# Order, cheapest first, so a failure stops the dearer work:
#   decide, dco                         seconds
#   workflow-lint, shell                about 20 seconds
#   rust (fmt and clippy, then the tests once, run under coverage)
# The dependency audit is not behind those gates: it is a security analysis and
# runs whatever the functional checks do.
# A job behind a failed gate is skipped, and the pull request is red because of
# the gate that failed and because `ci-gate` sees a suite skipped without the
# plan's leave.
#
# Nothing is cancelled across workflows. The other workflows of a commit are
# CodeQL and, inside this one, the dependency audit and the DCO check: security
# analyses, which a functional failure must never leave a commit without. What is
# dear and functional (the Rust builds) is behind the cheap gates by `needs`, so
# a failure stops it before it starts rather than after it has been paid for.
# Security work is not behind any gate and never cancelled.

on:
  push:
    branches: [develop]
  # No `edited` here, on purpose. It would rerun the whole CI, and cancel the one
  # in flight, every time somebody fixes the title or the body of a pull request.
  # It is not needed for safety either: the gate is named by base branch (see
  # ci-gate), so a pull request retargeted from develop to main has no check
  # called `ci-gate (main)` until a run for the new base exists, and one retargeted
  # the other way has no `ci-gate`. Each ruleset requires its own name, so the
  # pull request stays blocked, which fails closed without rerunning anything.
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

# A new push to a pull request makes the earlier run answer about a commit that
# no longer exists, so it is cancelled. A push to develop is never cancelled:
# each one is a merge somebody will read the result of.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  decide:
    name: decide
    runs-on: ubuntu-latest
    # Two checkouts' worth of work: one fetch and one diff.
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.decide.outputs.rust }}
      shell: ${{ steps.decide.outputs.shell }}
      workflows: ${{ steps.decide.outputs.workflows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read the paths this change touched against the map
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        # The script and the map are read from the BASE commit of a pull
        # request, never from the pull request itself: a change that could
        # rewrite the rule deciding what runs could switch its own checks off.
        # A change to either file is a path the map says reruns everything, and
        # a base that has neither falls back to running everything.
        run: |
          set -uo pipefail
          all() {
            echo "::notice::$1; every suite runs"
            printf '%s=true\n' rust shell workflows >> "$GITHUB_OUTPUT"
            exit 0
          }
          tmp="$RUNNER_TEMP/decide"
          mkdir -p "$tmp"
          if [ "$EVENT" = pull_request ]; then
            if [ "$BASE_REF" != develop ]; then
              all "the base is not develop, so no plan is trusted and every suite runs"
            fi
            from="$BASE_SHA"; to="$HEAD_SHA"; range="$from...$to"
            if ! git show "$BASE_SHA:.github/scripts/ci/decide.py" > "$tmp/decide.py" 2>/dev/null; then
              all "the base commit has no decision script yet"
            fi
            if ! git show "$BASE_SHA:.github/ci-map.json" > "$tmp/ci-map.json" 2>/dev/null; then
              all "the base commit has no map yet"
            fi
          elif [ "$EVENT" = push ]; then
            from="$BEFORE_SHA"; to="$AFTER_SHA"; range="$from..$to"
            cp .github/scripts/ci/decide.py .github/ci-map.json "$tmp/"
          else
            all "event $EVENT has no diff to read"
          fi
          git cat-file -e "${from}^{commit}" 2>/dev/null || all "the starting commit ${from} is not available"
          git cat-file -e "${to}^{commit}" 2>/dev/null || all "the ending commit ${to} is not available"
          git diff --name-only -z --no-renames "$range" > "$tmp/changed" || all "git diff failed"
          out="$(python3 -I "$tmp/decide.py" --map "$tmp/ci-map.json" < "$tmp/changed")" || all "the decision script failed"
          printf '%s\n' "$out" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$out"

  dco:
    # Pull requests only: the check reads the commits between the base and the
    # head, and a push has no base.
    if: ${{ github.event_name == 'pull_request' }}
    uses: ./.github/workflows/reusable-dco.yml

  workflow-lint:
    needs: [decide]
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/reusable-workflow-lint.yml
    with:
      run: ${{ needs.decide.outputs.workflows }}

  shell:
    needs: [decide]
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/reusable-shell-ci.yml
    with:
      run: ${{ needs.decide.outputs.shell }}
      test-command: ./tests/run.sh
      apt-packages: python3-cryptography

  # The dear Rust suite waits for the cheap checks, on a pull request: if one of
  # the three gates failed this job is skipped, and `ci-gate` is red because that
  # suite was skipped while the plan said it should run (and the failed gate is
  # red itself). The condition names the real gates only. The plan job is not
  # among them: if it fails nothing may end up skipped-and-green, and `ci-gate`
  # judges that on its own. A gate that was skipped by the plan is not a failure,
  # so a suite the map did not need does not hold this one back.
  rust:
    needs: [decide, dco, workflow-lint, shell]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || (needs.dco.result != 'failure' && needs.workflow-lint.result != 'failure' && needs.shell.result != 'failure')) }}
    uses: ./.github/workflows/reusable-rust-ci.yml
    with:
      run: ${{ needs.decide.outputs.rust }}
      # Coverage ratchet. The number went DOWN once, and the measurement got
      # stricter, which is worth reading carefully before anyone raises it.
      # The `#[cfg(test)] mod tests` blocks used to live inside the files they
      # test, and cargo-llvm-cov counted those test bodies as covered lines of
      # the production file. Moving them into sibling `tests.rs` files put them
      # under llvm-cov's default filename exclusion. Measured with the same
      # command, same commit, only the move between them:
      #
      #   before   8673 lines, 5878 covered, 67.77%
      #   after    4941 lines, 2355 covered, 47.66%
      #
      # So 45 is not a relaxed gate, it is the first honest one. Raise it in
      # the same pull request that raises the coverage, never silently.
      coverage-threshold: 45

  # The dependency audit has no plan: it runs on every pull request and every
  # push to develop. The paths a change touches say nothing about the advisory
  # database, which moves on its own, so a new advisory against what `develop`
  # already depends on must show up on the next pull request and not at the
  # release. With the pinned binaries it takes about 30 seconds. The weekly run
  # in audit.yml uses the same action, on `main` and on `develop`.
  audit:
    runs-on: ubuntu-latest
    # A ceiling, not a measurement: the first runs of this shape are the
    # sample from which it is tightened.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/cargo-audit

  # File length and folder size, so the tree cannot drift back into a few giant
  # files and crowded folders. It has no plan and runs on every pull request and
  # push: a change that only adds documents can fill a folder, and one that only
  # edits the exceptions can make `develop` red, so no path says it is safe to
  # skip. It costs about two seconds. On a pull request the tree is judged twice,
  # with the script and the exceptions of the BASE commit (a pull request cannot
  # raise its own limit) and with those of the tree (a pull request cannot leave
  # `develop` red for everyone after the merge), and both must pass. A base that
  # has neither yet, the change that introduces them, is judged by the tree's.
  structure:
    needs: [dco, workflow-lint, shell]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || (needs.dco.result != 'failure' && needs.workflow-lint.result != 'failure' && needs.shell.result != 'failure')) }}
    runs-on: ubuntu-latest
    # Two seconds of work over about 130 files, plus a checkout.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Judge the tree with the base copy and with the tree's copy
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -uo pipefail
          bad=0
          tmp="$RUNNER_TEMP/structure"
          mkdir -p "$tmp"
          if [ "$EVENT" = pull_request ]; then
            if git show "$BASE_SHA:.github/scripts/ci/structure.py" > "$tmp/structure.py" 2>/dev/null \
              && git show "$BASE_SHA:.github/structure.json" > "$tmp/structure.json" 2>/dev/null; then
              echo "== judged with the base commit's script and exceptions"
              python3 "$tmp/structure.py" --exceptions "$tmp/structure.json" || bad=1
            else
              echo "::notice::the base commit has no structure check yet; this change introduces it"
            fi
          fi
          echo "== judged with this tree's script and exceptions"
          python3 .github/scripts/ci/structure.py --exceptions .github/structure.json || bad=1
          exit "$bad"

  # The one check the rulesets require, besides the DCO check. GitHub counts a
  # required check that was skipped as passed, so no suite is required by its
  # own name: this job runs always and fails unless the plan was made and every
  # suite either succeeded or was skipped BECAUSE the plan said it had nothing
  # to look at. A suite skipped for any other reason (a gate before it failed,
  # the plan failed or came back empty) is a failure here, and so is a job that
  # was cancelled. The text is in this file and not in a script of the checkout,
  # so a pull request cannot rewrite the judge of its own checks (the wiring
  # test holds the rest of this in place).
  ci-gate:
    # The name says which gate this is. `ci.yml` also runs on a push to develop,
    # whose plan looked at the diff of that push only, and the promotion pull
    # request from develop into main points at the same commit: a gate named
    # alike on both events would let the push run satisfy the pull request. A
    # pull request into develop is planned by its diff and one into main runs
    # every suite, so the two bases carry different names and each ruleset
    # requires its own: `ci-gate` for develop, `ci-gate (main)` for main. Any
    # other base, which the trigger below does not let through, gets a name no
    # ruleset requires (`ci-gate (other base)`), so a pull request stacked on the
    # branch of another one cannot produce a required name and carry it along when
    # it is retargeted. `==` in an expression ignores case, so the trigger, which
    # does not, is what limits the bases, and the gate checks the base in the shell
    # as well before it approves under either name.
    name: ${{ github.event_name == 'pull_request' && (github.event.pull_request.base.ref == 'develop' && 'ci-gate' || (github.event.pull_request.base.ref == 'main' && 'ci-gate (main)' || 'ci-gate (other base)')) || format('ci-gate ({0})', github.event_name) }}
    needs: [decide, dco, workflow-lint, shell, rust, audit, structure]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EVENT: ${{ github.event_name }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      DECIDE: ${{ needs.decide.result }}
      DCO: ${{ needs.dco.result }}
      WORKFLOW_LINT: ${{ needs.workflow-lint.result }}
      SHELL_SUITE: ${{ needs.shell.result }}
      RUST: ${{ needs.rust.result }}
      AUDIT: ${{ needs.audit.result }}
      STRUCTURE: ${{ needs.structure.result }}
      PLAN_WORKFLOWS: ${{ needs.decide.outputs.workflows }}
      PLAN_SHELL: ${{ needs.decide.outputs.shell }}
      PLAN_RUST: ${{ needs.decide.outputs.rust }}
    steps:
      - name: Every suite passed, or the plan said it had nothing to check
        run: |
          set -uo pipefail
          bad=0
          fail() { echo "::error::$1"; bad=1; }
          # The name of this job depends on the base, and `==` in an expression ignores
          # case, so the base is checked here, exactly, before anything is approved.
          if [ "$EVENT" = pull_request ] && [ "$BASE_REF" != develop ] && [ "$BASE_REF" != main ]; then
            fail "the base of the pull request is '$BASE_REF', which is neither develop nor main"
          fi
          [ "$DECIDE" = success ] || fail "the plan job ended '$DECIDE', so no skipped suite can be trusted"
          suite() { # suite <name> <result> <plan>
            case "$2" in
              success) ;;
              skipped) [ "$3" = false ] || fail "$1 was skipped but the plan did not say it could be (plan: '${3:-empty}')" ;;
              *) fail "$1 ended '$2'" ;;
            esac
          }
          suite workflow-lint "$WORKFLOW_LINT" "$PLAN_WORKFLOWS"
          suite shell "$SHELL_SUITE" "$PLAN_SHELL"
          suite rust "$RUST" "$PLAN_RUST"
          [ "$AUDIT" = success ] || fail "audit ended '$AUDIT' and has no plan to excuse it"
          [ "$STRUCTURE" = success ] || fail "structure ended '$STRUCTURE' and has no plan to excuse it"
          if [ "$EVENT" = pull_request ]; then
            [ "$DCO" = success ] || fail "dco ended '$DCO'"
          fi
          printf '%-14s %-10s %s\n' job result plan
          printf '%-14s %-10s %s\n' decide "$DECIDE" - dco "$DCO" - audit "$AUDIT" - structure "$STRUCTURE" - \
            workflow-lint "$WORKFLOW_LINT" "${PLAN_WORKFLOWS:-empty}" shell "$SHELL_SUITE" "${PLAN_SHELL:-empty}" \
            rust "$RUST" "${PLAN_RUST:-empty}"
          [ "$bad" -eq 0 ] && echo "every suite passed or had nothing to check"
          exit "$bad"
