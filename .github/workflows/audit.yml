name: Audit

on:
  schedule:
    # Weekly Monday 06:00 UTC.
    - cron: '0 6 * * 1'
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

# cargo-audit gate. Inlined rather than calling the org's
# `rust-audit.yml` reusable, because the reusable offers no input
# to pass extra `--ignore` flags and hardcodes `cargo audit --deny
# warnings` — and cargo-audit 0.22.2 has a regression where
# audit.toml's `[advisories] ignore = [...]` is not picked up from
# the project root (verified: `cargo audit` runs from the working-
# directory but does not read `audit.toml` unless it's at
# `~/.cargo/audit.toml`). This workflow inlines the cargo-audit
# invocation with the ignores + the toolchain pin so the gate is
# unambiguous and self-contained. The reachability analysis for
# each entry lives in `audit.toml` (project root) and is updated
# whenever the underlying dep changes.
#
# When cargo-audit is bumped past the 0.22.2 regression, delete
# the inline cargo-audit step and call the reusable again. The
# reusable's `deny` job (cargo-deny) is not enabled here — see
# the cargo-deny PR that introduces a `deny.toml` for the policy.
jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      TOOLCHAIN: '1.97'
      AUDIT_VERSION: '0.22.2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install toolchain
        env:
          TOOLCHAIN: ${{ env.TOOLCHAIN }}
        run: |
          rustup toolchain install "$TOOLCHAIN" --profile minimal
          rustup default "$TOOLCHAIN"

      - name: Install cargo-audit
        env:
          TOOL_VERSION: ${{ env.AUDIT_VERSION }}
        run: command -v cargo-audit >/dev/null || cargo install cargo-audit --version "=$TOOL_VERSION" --locked

      - name: Run cargo audit
        # `--deny warnings` covers vulnerabilities + soundness +
        # unmaintained + unsound + yanked — every advisory class. We
        # ignore only what's documented in `audit.toml` with a measured
        # reachability argument. Do not add `--no-yanked`: that flag
        # silently turns off half the gate (yanked crates can be
        # exploitable transitively or pin down a security surface
        # that should fail closed).
        run: |
          cargo audit --deny warnings \
            --ignore RUSTSEC-2023-0071
