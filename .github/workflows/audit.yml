name: Audit

# The dependency audit: on every pull request and push, and weekly for the case
# in which nothing changed in the repository and an advisory was published
# against what it already depends on. GitHub reads `schedule:` from the default
# branch only, so the cron does nothing until this file is on `main`.
#
# The tools, their versions and their checksums live in the composite action
# `.github/actions/cargo-audit`, which the release gate uses too.

on:
  schedule:
    # Weekly Monday 06:00 UTC.
    - cron: '0 6 * * 1'
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    # A ceiling, not a measurement: the first runs of this shape are the
    # sample from which it is tightened.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/cargo-audit
