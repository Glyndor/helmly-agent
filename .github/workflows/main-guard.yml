name: guard

on:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened, edited]

permissions: {}

jobs:
  develop-only:
    name: develop-only
    runs-on: ubuntu-latest
    steps:
      - name: Require develop as source branch
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
        run: |
          # A fork can have a branch called develop, so the branch name alone
          # is not enough: the head must be this repository's develop.
          if [ "$HEAD_REF" != "develop" ] || [ "$HEAD_REPO" != "$THIS_REPO" ]; then
            echo "::error::Pull requests into main must come from develop of this repository (got $HEAD_REPO:$HEAD_REF)."
            exit 1
          fi
          echo "Source branch is develop of this repository."
