name: Rust CI (reusable)

# The Rust half of ci.yml and of release.yml: format and lint, tests, coverage.
# It is called with the verdict of the `decide` job, and every job below is
# skipped when that verdict is `false`. The jobs still exist when skipped, which
# is what lets a required check report instead of leaving a pull request waiting
# for a check that never started.
#
# Measured over 21 runs: lint 80 s, test 116 s, coverage 122 s.
#
# The toolchain is whatever `rust-toolchain.toml` names. Nothing here chooses
# one, so there is no second place for it to drift.
#
# Concurrency is the caller's: a group declared here would be shared by every
# push to develop and cancel a run that somebody is waiting for.

on:
  workflow_call:
    inputs:
      run:
        description: >-
          `false` skips every job. Anything else, including an empty value from
          a `decide` job that failed, runs them, so a broken decision never
          switches a check off.
        type: string
        default: "true"
      coverage-threshold:
        description: Minimum line coverage percentage (0 disables the gate)
        type: number
        default: 0
      llvm-cov-version:
        description: Exact version of cargo-llvm-cov
        type: string
        default: "0.9.2"

permissions:
  contents: read

jobs:
  lint:
    name: Format & lint
    if: ${{ inputs.run != 'false' }}
    runs-on: ubuntu-latest
    # Measured 80 s mean, 133 s worst over 21 runs.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install toolchain
        run: rustup toolchain install

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: rust-lint-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: rust-lint-${{ runner.os }}-

      - name: rustfmt
        run: cargo fmt --all --check

      - name: clippy
        # Every warning fails, deprecation warnings included (`deprecated` is a
        # warn-by-default lint), so a deprecated call cannot come back in.
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

  test:
    name: Test
    if: ${{ inputs.run != 'false' }}
    runs-on: ubuntu-latest
    # Measured 116 s mean, 163 s worst over 21 runs.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install toolchain
        run: rustup toolchain install

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: rust-test-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: rust-test-${{ runner.os }}-

      - name: Tests
        run: cargo test --locked --all-features --workspace

  coverage:
    name: Coverage
    if: ${{ inputs.run != 'false' && inputs.coverage-threshold > 0 }}
    runs-on: ubuntu-latest
    # Measured 122 s mean, 186 s worst over 21 runs.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install toolchain
        run: |
          rustup toolchain install
          rustup component add llvm-tools

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cargo/bin
            target
          # The tool version is part of the key: a cache built under an older
          # pin must not survive a version bump via the `command -v ... ||`
          # short-circuit below, or the pin would be silently ignored.
          key: rust-cov-${{ runner.os }}-${{ inputs.llvm-cov-version }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: rust-cov-${{ runner.os }}-${{ inputs.llvm-cov-version }}-

      - name: Install cargo-llvm-cov
        env:
          LLVM_COV_VERSION: ${{ inputs.llvm-cov-version }}
        run: command -v cargo-llvm-cov >/dev/null || cargo install cargo-llvm-cov --locked --version "$LLVM_COV_VERSION"

      - name: Coverage gate
        env:
          COVERAGE_THRESHOLD: ${{ inputs.coverage-threshold }}
        run: |
          cargo llvm-cov --locked --workspace --all-features --summary-only --json --output-path coverage.json
          PCT=$(python3 -c "import json; print(json.load(open('coverage.json'))['data'][0]['totals']['lines']['percent'])")
          echo "### Coverage: ${PCT}% (threshold: ${COVERAGE_THRESHOLD}%)" >> "$GITHUB_STEP_SUMMARY"
          python3 - "$PCT" "$COVERAGE_THRESHOLD" <<'PY'
          import sys
          pct, threshold = float(sys.argv[1]), float(sys.argv[2])
          sys.exit(0 if pct >= threshold else 1)
          PY

  # Two required checks of the `develop` ruleset, `rust / MSRV` and
  # `rust / Extra platforms`, answer questions this repository does not ask: it
  # declares no minimum Rust version and tests on Linux only. Both used to be
  # gates over jobs that were always skipped. They stay as the checks they are,
  # named the same, so the ruleset keeps matching them, and they report the
  # honest answer. Both go as soon as no ruleset requires them by name: a
  # required check that is missing blocks every pull request, so the jobs
  # outlive the requirement and not the other way round.
  msrv-gate:
    name: MSRV
    if: ${{ inputs.run != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "No minimum supported Rust version is declared; the pinned toolchain in rust-toolchain.toml is the only one this repository builds with."

  extra-platforms-gate:
    name: Extra platforms
    if: ${{ inputs.run != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "The agent is Linux-only; no other platform is built or tested."
